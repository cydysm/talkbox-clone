<ul>
  {% for t in share_targets %}
  <li>
    {% if t.kind == "copy" %}
    <a class="icon share-copy" href="#" data-share-message="{{ t.message }}" aria-label="{{ t.label }}">
      <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="{{ t.icon }}"/></svg>
    </a>
    {% else %}
    <a class="icon" href="{{ t.href }}" target="_blank" rel="noopener noreferrer" aria-label="{{ t.label }}">
      <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="{{ t.icon }}"/></svg>
    </a>
    {% endif %}
  </li>
  {% endfor %}
</ul>
