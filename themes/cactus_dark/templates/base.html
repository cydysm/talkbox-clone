{% load static %}
<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}{{ SITE_NAME }}{% endblock %}</title>
    <meta name="description" content="{% block description %}{{ SITE_NAME }} - Python blog{% endblock %}">
    {% block canonical %}{% endblock %}
    <link rel="stylesheet" href="/static/themes/{{ THEME_NAME }}/css/main.css">
  </head>
  <body>
    <header class="site-header">
      <a href="{% url 'blog:post-list' %}" class="site-title">{{ SITE_NAME }}</a>
      <nav><a href="/admin/">Admin</a></nav>
    </header>
    <main>{% block content %}{% endblock %}</main>
    <footer>Powered by {{ SITE_NAME }}</footer>
  </body>
</html>
