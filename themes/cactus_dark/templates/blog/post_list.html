{% extends "base.html" %}

{% block title %}{{ SITE_NAME }}{% endblock %}
{% block content %}
  <section class="post-list">
    {% for post in posts %}
      <article>
        <h2><a href="{{ post.get_absolute_url }}">{{ post.title }}</a></h2>
        <p>{{ post.excerpt|default:post.content_markdown|truncatewords:50 }}</p>
      </article>
    {% empty %}
      <p>No posts yet.</p>
    {% endfor %}
  </section>
{% endblock %}
