{% extends "base.html" %}

{% block title %}{{ page.title }} | {{ SITE_NAME }}{% endblock %}
{% block description %}{{ SITE_NAME }} - {{ page.title }}{% endblock %}
{% block canonical %}<link rel="canonical" href="{{ request.build_absolute_uri }}">{% endblock %}
{% block content %}
  <article class="post">
    <header>
      <h1 class="posttitle">{{ page.title }}</h1>
    </header>
    <div class="content">{{ content_html|safe }}</div>
  </article>
{% endblock %}
