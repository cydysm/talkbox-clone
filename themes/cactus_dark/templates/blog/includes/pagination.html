{% if page_obj.paginator.num_pages > 1 %}
  <nav class="pagination" aria-label="文章分页">
    {% if page_obj.has_previous %}<a href="?page={{ page_obj.previous_page_number }}">&#8249;</a>{% endif %}
    {% for item in page_window %}
      {% if item == "gap" %}
        <span class="gap">…</span>
      {% elif item == page_obj.number %}
        <span class="current">{{ item }}</span>
      {% else %}
        <a href="?page={{ item }}">{{ item }}</a>
      {% endif %}
    {% endfor %}
    {% if page_obj.has_next %}<a href="?page={{ page_obj.next_page_number }}">&#8250;</a>{% endif %}
  </nav>
{% endif %}
